<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>صفحة بسيطة</title>
  <style>
    html,body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", Tahoma, "Helvetica Neue", Arial, sans-serif;
      background: #ffffff;
      color: #111;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      direction: rtl;
      padding: 24px;
      box-sizing: border-box;
    }
    .bism {
      font-size: 2.2rem;
      font-weight: 600;
      margin: 0 0 18px 0;
    }
    .name {
      font-size: 1.6rem;
      font-weight: 500;
      margin: 0;
      white-space: pre-wrap;
    }
    @media (max-width: 480px) {
      .bism { font-size: 1.6rem; }
      .name { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="container" role="main">
    <div class="bism">بسم اللله الرحمن الرحيم</div>
    <div class="name">عبدالله صالح عبدالله المصعبي</div>
  </div>
</body>
</html>
